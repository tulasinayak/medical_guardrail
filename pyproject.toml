[project]
name = "medical-guardrails"
version = "0.1.0"
description = "A staged guardrail wrapping an LLM for health-related queries: pre-generation slot-filling, retrieval-grounded generation, and post-generation claim verification."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = ["pandas>=2.2", "scikit-learn>=1.4"]
adversarial = ["spikee"]
gui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires real network access and a local Ollama server to be running",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
